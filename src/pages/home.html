<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/home.css">
  <link rel="stylesheet" href="../sections/hero/hero.css">
  <link rel="stylesheet" href="../sections/diferencial/diferencial.css">
  <link rel="stylesheet" href="../sections/como-funciona/como-funciona.css">
  <link rel="stylesheet" href="../sections/modalidades/modalidades.css">
  <link rel="stylesheet" href="../sections/planos/planos.css">
  <link rel="stylesheet" href="../sections/compare-planos/compare-planos.css">
  <link rel="stylesheet" href="../sections/saude-integral/saude-integral.css">
</head>
<body id="top">
  <header class="site-header">
    <a class="site-header__logo" href="#top" aria-label="Vitta">
      <img
        class="site-header__logo-image"
        src="../../public/assets/icons/logo.svg"
        alt=""
        aria-hidden="true"
      >
    </a>

    <nav class="site-nav" aria-label="Navegação principal">
      <a href="#como-funciona">Como funciona</a>
      <a href="#modalidades">Modalidades</a>
      <a href="#planos">Planos</a>
      <a href="#parceiros">Parceiros</a>
      <a href="#seja-parceiro">Seja Parceiro</a>
    </nav>

    <div class="site-header__actions">
      <a class="site-header__login" href="#entrar">Entrar</a>
      <a class="button button--primary button--header" href="#">COMEÇAR AGORA</a>
    </div>

    <button
      class="site-header__menu-button"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <img
        class="site-header__menu-icon site-header__menu-icon--open"
        src="../../public/assets/icons/menu-abrir.svg"
        alt=""
        aria-hidden="true"
      >
      <img
        class="site-header__menu-icon site-header__menu-icon--close"
        src="../../public/assets/icons/menu-fechar.svg"
        alt=""
        aria-hidden="true"
      >
    </button>
  </header>

  <nav id="mobile-menu" class="mobile-menu" aria-label="Navegação mobile" aria-hidden="true">
    
    <a href="#como-funciona">Como funciona</a>
    <a href="#modalidades">Modalidades</a>
    <a href="#planos">Planos</a>
    <a href="#parceiros">Parceiros</a>
    <a href="#seja-parceiro">Seja Parceiro</a>
    
    <div class="mobile-menu-actions">
        <a href="#" class="button button--secondary">
            Entrar
        </a>

        <a href="#" class="button button--primary">
            COMEÇAR AGORA
        </a>
    </div>
  </nav>

  <main>
    <!-- A Home apenas organiza as seções. -->
    <div data-section="hero"></div>
    <div data-section="diferencial"></div>
    <div id="como-funciona" data-section="como-funciona"></div>
    <div id="modalidades" data-section="modalidades"></div>
    <div data-section="compare-planos"></div>
    <div data-section="saude-integral"></div>
    <div id="planos" data-section="planos"></div>
  </main>

  <script type="module" src="../scripts/main.js"></script>
</body>
</html>
