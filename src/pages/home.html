  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="../styles/home.css">

<body>
  <header class="site-header">
    <a class="site-header__logo" href="/" aria-label="Vitta">
      <!-- TODO: substituir pelo logo SVG original -->
      <span class="logo-placeholder" aria-hidden="true">Vitta</span>
    </a>

      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      <img
        class="site-header__menu-icon site-header__menu-icon--open"
        src="../../public/assets/icons/menu-abrir.svg"

        alt=""
        aria-hidden="true"

  <nav id="mobile-menu" class="mobile-menu" aria-label="Navegação mobile" aria-hidden="true">
